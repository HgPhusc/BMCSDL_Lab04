<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập | Lab 04</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary:#0f172a; --accent:#06b6d4; --accent2:#8b5cf6; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Segoe UI',system-ui,sans-serif;
            background:linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0c1445 100%);
            min-height:100vh; display:flex; align-items:center; justify-content:center;
        }
        .container { width:420px; }
        .card {
            background:#fff; border-radius:20px;
            box-shadow:0 30px 80px rgba(0,0,0,.4); overflow:hidden;
        }
        .card-header {
            background:linear-gradient(135deg, var(--primary), #1e1b4b);
            padding:32px; text-align:center; color:#fff;
        }
        .logo { font-size:2rem; margin-bottom:8px; }
        .card-header h1 { font-size:1.25rem; font-weight:900; }
        .lab-badge {
            display:inline-block; margin-top:8px; padding:4px 14px;
            background:linear-gradient(90deg, var(--accent), var(--accent2));
            border-radius:20px; font-size:.7rem; font-weight:800; letter-spacing:.5px;
        }
        .card-body { padding:28px; }

        /* CRYPTO FLOW DIAGRAM */
        .crypto-diagram {
            background:#0f172a; border-radius:10px; padding:14px; margin-bottom:22px;
            font-size:.72rem; color:rgba(255,255,255,.8);
        }
        .crypto-diagram .title { color:var(--accent); font-weight:700; margin-bottom:8px; font-size:.72rem; letter-spacing:.5px; }
        .flow-steps { display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
        .flow-step { background:rgba(255,255,255,.08); border-radius:5px; padding:3px 8px; }
        .flow-step.highlight { background:rgba(6,182,212,.2); border:1px solid rgba(6,182,212,.4); color:var(--accent); }
        .flow-arrow { color:var(--accent2); font-weight:900; }

        .form-group { margin-bottom:14px; }
        .form-group label { display:block; font-size:.74rem; font-weight:700; color:#475569; margin-bottom:5px; }
        .input-wrap { position:relative; }
        .input-wrap i { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:#94a3b8; }
        .input-wrap input {
            width:100%; padding:10px 12px 10px 36px;
            border:1.5px solid #e2e8f0; border-radius:9px; font-size:.87rem;
            transition:border-color .2s; background:#f8fafc;
        }
        .input-wrap input:focus { outline:none; border-color:var(--accent); background:#fff; }

        .error-msg { background:#fef2f2; color:#991b1b; border-left:4px solid #ef4444; padding:9px 14px; border-radius:8px; font-size:.8rem; margin-bottom:14px; display:none; }
        .error-msg.show { display:flex; align-items:center; gap:8px; }

        .btn-login {
            width:100%; padding:12px; border:none; border-radius:10px; cursor:pointer;
            background:linear-gradient(135deg, var(--primary), #1e1b4b);
            color:#fff; font-size:.92rem; font-weight:800;
            transition:all .2s; box-shadow:0 4px 14px rgba(15,23,42,.3);
            display:flex; align-items:center; justify-content:center; gap:8px;
        }
        .btn-login:hover { transform:translateY(-1px); box-shadow:0 6px 20px rgba(15,23,42,.4); }
        .btn-login:disabled { opacity:.7; cursor:not-allowed; transform:none; }

        .spinner { width:14px; height:14px; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:spin .6s linear infinite; display:none; }
        @keyframes spin { to { transform:rotate(360deg) } }

        .status-log {
            background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px;
            padding:10px 12px; margin-top:14px; font-size:.72rem; color:#64748b;
            font-family:monospace; display:none; max-height:80px; overflow-y:auto;
        }
        .status-log.show { display:block; }
        .status-log .log-line { padding:1px 0; }
        .status-log .log-line.ok { color:#059669; }
        .status-log .log-line.info { color:var(--accent); }

        .footer { padding:14px 28px; text-align:center; font-size:.72rem; color:#94a3b8; border-top:1px solid #f1f5f9; }
        .hint { background:#f0fdf4; border-radius:8px; padding:10px 12px; margin-top:12px; font-size:.74rem; color:#065f46; }
    </style>

    <script>
    // Nhúng ClientCrypto từ base (copy lại để dùng trên trang login standalone)
    const ClientCrypto = {
        async hashPassword(password) {
            const data = new TextEncoder().encode(password);
            const hash = await crypto.subtle.digest('SHA-1', data);
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
        },
        async generateKeyPair() {
            return await crypto.subtle.generateKey(
                { name:'RSA-OAEP', modulusLength:2048, publicExponent:new Uint8Array([1,0,1]), hash:'SHA-1' },
                true, ['encrypt','decrypt']
            );
        },
        async exportPublicKey(key) {
            const exp = await crypto.subtle.exportKey('spki', key);
            return btoa(String.fromCharCode(...new Uint8Array(exp)));
        },
        async exportPrivateKey(key) {
            const exp = await crypto.subtle.exportKey('pkcs8', key);
            return btoa(String.fromCharCode(...new Uint8Array(exp)));
        },
        savePrivateKey(b64) {
            localStorage.setItem('lab04_privateKey', b64);
            localStorage.setItem('lab04_keyVersion', '1.0_SHA1');
        },
        savePublicKey(b64) {
            localStorage.setItem('lab04_publicKey', b64);
        },
        loadPrivateKey() {
            if (!ClientCrypto.validateKeyVersion()) {
                ClientCrypto.clearKeys();
                return null;
            }
            return localStorage.getItem('lab04_privateKey');
        },
        loadPublicKey() {
            return localStorage.getItem('lab04_publicKey');
        },
        clearKeys() {
            localStorage.removeItem('lab04_privateKey');
            localStorage.removeItem('lab04_publicKey');
            localStorage.removeItem('lab04_keyVersion');
        },
        validateKeyVersion() {
            const currentVersion = '1.0_SHA1';
            const savedVersion = localStorage.getItem('lab04_keyVersion');
            if (!savedVersion || savedVersion !== currentVersion) {
                console.warn('⚠️ Phát hiện cập nhật cấu hình key. Xóa key cũ...');
                return false;
            }
            return true;
        }
    };
    </script>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header">
            <div class="logo">🎓</div>
            <h1>QLSVNhom — Lab 04</h1>
            <div class="lab-badge">CLIENT-SIDE ENCRYPTION</div>
        </div>
        <div class="card-body">
            <div class="crypto-diagram">
                <div class="title">🔐 QUY TRÌNH ĐĂNG NHẬP</div>
                <div class="flow-steps">
                    <div class="flow-step">Nhập MK</div>
                    <div class="flow-arrow">→</div>
                    <div class="flow-step highlight">SHA-1 (Client)</div>
                    <div class="flow-arrow">→</div>
                    <div class="flow-step">Gửi Hash lên Server</div>
                    <div class="flow-arrow">→</div>
                    <div class="flow-step highlight">Server so sánh Hash</div>
                </div>
            </div>

            <div class="error-msg" id="errMsg">
                <i class="fa fa-exclamation-triangle"></i>
                <span id="errText"></span>
            </div>

            <div class="form-group">
                <label>MÃ NHÂN VIÊN</label>
                <div class="input-wrap">
                    <i class="fa fa-id-card"></i>
                    <input type="text" id="manv" placeholder="VD: NV01" required>
                </div>
            </div>
            <div class="form-group">
                <label>MẬT KHẨU</label>
                <div class="input-wrap">
                    <i class="fa fa-lock"></i>
                    <input type="password" id="matkhau" placeholder="Nhập mật khẩu" required>
                </div>
            </div>

            <button class="btn-login" id="btnLogin" onclick="doLogin()">
                <span id="btnText"><i class="fa fa-sign-in-alt"></i> ĐĂNG NHẬP</span>
                <div class="spinner" id="spinner"></div>
            </button>

            <div class="status-log" id="statusLog"></div>

            <div class="hint">
                💡 <strong>Lưu ý Lab 04:</strong> Mật khẩu được hash SHA-1 ngay tại browser trước khi gửi lên server. Server <strong>không bao giờ nhận mật khẩu gốc</strong>.
            </div>
        </div>
        <div class="footer">Khoa CNTT · ĐH Khoa học Tự nhiên TP.HCM</div>
    </div>
</div>

<script>
function log(msg, type='info') {
    const box = document.getElementById('statusLog');
    box.classList.add('show');
    box.innerHTML += `<div class="log-line ${type}">▶ ${msg}</div>`;
    box.scrollTop = box.scrollHeight;
}

function showError(msg) {
    document.getElementById('errText').textContent = msg;
    document.getElementById('errMsg').classList.add('show');
}

async function doLogin() {
    const manv     = document.getElementById('manv').value.trim().toUpperCase();
    const matkhau  = document.getElementById('matkhau').value.trim();
    const btn      = document.getElementById('btnLogin');
    const spinner  = document.getElementById('spinner');
    const btnText  = document.getElementById('btnText');

    document.getElementById('errMsg').classList.remove('show');
    document.getElementById('statusLog').innerHTML = '';

    if (!manv || !matkhau) { showError('Vui lòng nhập đầy đủ!'); return; }

    btn.disabled = true;
    spinner.style.display = 'block';
    btnText.style.display = 'none';

    try {
        // BƯỚC 1: Hash mật khẩu tại CLIENT
        log('Đang hash mật khẩu bằng SHA-1 tại client...');
        const mkHash = await ClientCrypto.hashPassword(matkhau);
        log(`SHA-1 hash: ${mkHash.substring(0,16)}...`, 'ok');

        // BƯỚC 2: Gửi hash lên server (KHÔNG gửi password gốc)
        log('Gửi hash lên server để xác thực...');
        const res = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ manv, mk_hash: mkHash })
        });
        const data = await res.json();

        if (!data.success) {
            showError(data.error || 'Đăng nhập thất bại!');
            return;
        }

        log('Xác thực thành công!', 'ok');

        // BƯỚC 3: Kiểm tra xem NV đã có key chưa (từ localStorage)
        const savedPrivKey = ClientCrypto.loadPrivateKey();
        let savedPubKey = ClientCrypto.loadPublicKey();
        let pubKeyToSync = null;

        if (savedPrivKey) {
            log('Đã có Private Key cục bộ.', 'ok');
            if (savedPubKey) {
                log('Đã có Public Key cục bộ.', 'ok');
            } else {
                log('Có Private Key nhưng chưa có Public Key cục bộ. Thử lấy từ server...');
                const pubRes = await fetch(`/api/pubkey/${manv}`);
                const pubData = await pubRes.json();
                if (pubData.success && pubData.pubkey) {
                    savedPubKey = pubData.pubkey;
                    ClientCrypto.savePublicKey(savedPubKey);
                    log('Public Key đã lấy từ server và lưu local.', 'ok');
                } else {
                    log('Không tìm thấy Public Key trên server; sẽ tạo cặp khóa mới.', 'info');
                }
            }
        }

        if (!savedPrivKey) {
            log('Không có Private Key cục bộ. Tạo cặp khóa RSA-OAEP 2048-bit mới...');
            const keyPair = await ClientCrypto.generateKeyPair();
            const pubKeyB64  = await ClientCrypto.exportPublicKey(keyPair.publicKey);
            const privKeyB64 = await ClientCrypto.exportPrivateKey(keyPair.privateKey);
            ClientCrypto.savePrivateKey(privKeyB64);
            ClientCrypto.savePublicKey(pubKeyB64);
            pubKeyToSync = pubKeyB64;
            log('Private Key và Public Key mới đã được lưu vào localStorage.', 'ok');
        } else {
            log('Đã giữ lại Private Key cục bộ hiện có.', 'ok');
            if (!savedPubKey) {
                log('Public Key cục bộ vẫn thiếu. Chỉ sử dụng Private Key hiện có để giữ nguyên khả năng giải mã lương cũ.', 'info');
            }
        }

        if (pubKeyToSync) {
            log('Cập nhật Public Key lên server...');
            const updateRes = await fetch('/api/update_pubkey', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pubkey: pubKeyToSync })
            });
            const updateData = await updateRes.json();
            if (!updateData.success) {
                showError(updateData.error || 'Không cập nhật được Public Key lên server.');
                return;
            }
            log('Public Key đã được đồng bộ lên server.', 'ok');
        }

        log('Chuyển hướng đến dashboard...', 'ok');
        window.location.href = '/dashboard';

    } catch (e) {
        showError('Lỗi: ' + e.message);
    } finally {
        btn.disabled = false;
        spinner.style.display = 'none';
        btnText.style.display = 'flex';
    }
}

// Cho phép nhấn Enter
document.addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
